<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>公告 - 1933</title>
  <style>
    :root {
      --bg: #f5f7fa;
      --card: #ffffff;
      --border: #e2e8f0;
      --text: #1e293b;
      --muted: #64748b;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      line-height: 1.6;
      padding: 80px 16px 48px;
    }

    .back-btn {
      position: fixed;
      top: 20px;
      left: 20px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--card);
      border: 1px solid var(--border);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: var(--text);
      text-decoration: none;
      z-index: 999;
      transition: background 0.15s ease, transform 0.15s ease;
    }

    .back-btn:hover {
      background: #eef2f7;
      transform: scale(1.05);
    }

    .back-btn:active {
      transform: scale(0.95);
    }

    .page-title {
      max-width: 680px;
      margin: 0 auto 20px;
      font-size: 22px;
      font-weight: 700;
    }

    .notice-list {
      max-width: 680px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .notice {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      transition: box-shadow 0.15s ease;
    }

    .notice[open] {
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
    }

    .notice summary {
      padding: 16px 18px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      list-style: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      user-select: none;
    }

    .notice summary::-webkit-details-marker {
      display: none;
    }

    .notice summary::after {
      content: "";
      width: 8px;
      height: 8px;
      border-right: 2px solid var(--muted);
      border-bottom: 2px solid var(--muted);
      transform: rotate(45deg);
      transition: transform 0.2s ease;
      flex-shrink: 0;
    }

    .notice[open] summary::after {
      transform: rotate(-135deg);
    }

    .notice-body {
      margin: 0;
      padding: 14px 18px 16px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 14px;
    }
  </style>
</head>
<body>

  <a href="https://hr1933-web.netlify.app/" class="back-btn" aria-label="返回">←</a>

  <h1 class="page-title">📢 公告</h1>

  <div class="notice-list">
    <details class="notice" name="notice">
      <summary>快来使用1933的留言板吧！</summary>
      <p class="notice-body">本网站的创建者是1933，如有问题请尝试与他联系。</p>
    </details>
  </div>

  <script>
    document.querySelectorAll('details.notice').forEach(function (item) {
      item.addEventListener('toggle', function () {
        if (!item.open) return;
        document.querySelectorAll('details.notice').forEach(function (other) {
          if (other !== item) other.open = false;
        });
      });
    });
  </script>

</body>
</html>
